<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4572e">
  <title>Pin City</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <button id="back" class="icon hidden" aria-label="Back">←</button>
    <div class="title" id="title">📍 Pin City</div>
    <button id="account" class="ghost">Sign in</button>
  </header>

  <main>
    <section id="home" class="page">
      <div class="hero">
        <h1>Where the locals would take you.</h1>
        <p>Every pin is picked by the Pin City team, and most we've tried ourselves. No star ratings, no crowd noise.</p>
      </div>
      <h2 id="my-cities-title" class="hidden">Your cities</h2>
      <div id="my-cities" class="cards"></div>
      <h2>Explore cities</h2>
      <div id="all-cities" class="cards"></div>
      <p id="offline-note" class="note hidden">You're offline. Showing the pins saved on this device.</p>
    </section>

    <section id="city" class="page hidden">
      <div id="map"></div>
      <div class="chips" id="chips"></div>
      <button id="locate" class="fab" aria-label="Show where I am">◎</button>
      <div class="sheet" id="sheet">
        <div class="grab"></div>
        <div id="sheet-body"></div>
      </div>
    </section>
  </main>

  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="toast"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
